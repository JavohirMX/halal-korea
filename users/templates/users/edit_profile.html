{% extends 'places/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="lg:grid lg:grid-cols-12 lg:gap-x-5">
        <!-- Profile Sidebar -->
        <aside class="py-6 px-2 sm:px-6 lg:py-0 lg:px-0 lg:col-span-3">
            <nav class="space-y-1">
                <a href="{% url 'users:profile' %}" 
                   class="text-gray-900 hover:bg-gray-50 group rounded-md px-3 py-2 flex items-center text-sm font-medium">
                    <i class="fas fa-user-circle text-gray-400 group-hover:text-gray-500 flex-shrink-0 -ml-1 mr-3 h-6 w-6"></i>
                    <span class="truncate">Profile</span>
                </a>
                <a href="{% url 'users:edit_profile' %}"
                   class="bg-gray-50 text-primary-600 hover:bg-white group rounded-md px-3 py-2 flex items-center text-sm font-medium">
                    <i class="fas fa-cog text-primary-500 group-hover:text-primary-500 flex-shrink-0 -ml-1 mr-3 h-6 w-6"></i>
                    <span class="truncate">Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Edit Profile Form -->
        <div class="space-y-6 sm:px-6 lg:px-0 lg:col-span-9">
            <form method="POST" class="shadow sm:rounded-md sm:overflow-hidden">
                {% csrf_token %}
                <div class="bg-white py-6 px-4 space-y-6 sm:p-6">
                    <div>
                        <h3 class="text-lg leading-6 font-medium text-gray-900">Profile Settings</h3>
                        <p class="mt-1 text-sm text-gray-500">
                            Update your profile information.
                        </p>
                    </div>

                    {% if form.errors %}
                    <div class="rounded-md bg-red-50 p-4">
                        <div class="flex">
                            <div class="ml-3">
                                <h3 class="text-sm font-medium text-red-800">
                                    Please correct the following errors:
                                </h3>
                                <div class="mt-2 text-sm text-red-700">
                                    {{ form.errors }}
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endif %}

                    <div class="grid grid-cols-6 gap-6">
                        <div class="col-span-6 sm:col-span-4">
                            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                            <input type="text" 
                                   name="username" 
                                   id="username" 
                                   value="{{ form.username.value|default:'' }}"
                                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
                        </div>

                        <div class="col-span-6 sm:col-span-4">
                            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" 
                                   name="email" 
                                   id="email" 
                                   value="{{ form.email.value|default:'' }}"
                                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
                        </div>
                    </div>
                </div>
                <div class="px-4 py-3 bg-gray-50 text-right sm:px-6">
                    <button type="submit"
                            class="bg-primary-600 border border-transparent rounded-md shadow-sm py-2 px-4 inline-flex justify-center text-sm font-medium text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                        Save changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
