{% load i18n %}
<!-- Skeleton Loader for Place Cards -->
<div id="skeleton-loader" class="space-y-3">
    <!-- Mobile Skeleton Card -->
    <div class="lg:hidden bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="flex gap-3 p-3">
            <!-- Image Skeleton -->
            <div class="flex-shrink-0 w-24 h-24 bg-gray-200 dark:bg-gray-700 rounded-lg skeleton"></div>
            
            <!-- Content Skeleton -->
            <div class="flex-1 min-w-0 flex flex-col space-y-2">
                <!-- Title -->
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded skeleton w-3/4"></div>
                
                <!-- Category & Distance -->
                <div class="flex items-center gap-2">
                    <div class="h-5 bg-gray-200 dark:bg-gray-700 rounded-full skeleton w-20"></div>
                    <div class="h-5 bg-gray-200 dark:bg-gray-700 rounded-full skeleton w-16"></div>
                </div>
                
                <!-- Description -->
                <div class="space-y-1">
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded skeleton w-full"></div>
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded skeleton w-4/5"></div>
                </div>
                
                <!-- Map Links -->
                <div class="flex gap-1.5 mt-auto">
                    <div class="w-7 h-7 bg-gray-200 dark:bg-gray-700 rounded-md skeleton"></div>
                    <div class="w-7 h-7 bg-gray-200 dark:bg-gray-700 rounded-md skeleton"></div>
                    <div class="w-7 h-7 bg-gray-200 dark:bg-gray-700 rounded-md skeleton"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Repeat for multiple skeleton cards -->
    <div class="lg:hidden bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="flex gap-3 p-3">
            <div class="flex-shrink-0 w-24 h-24 bg-gray-200 dark:bg-gray-700 rounded-lg skeleton"></div>
            <div class="flex-1 min-w-0 flex flex-col space-y-2">
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded skeleton w-2/3"></div>
                <div class="flex items-center gap-2">
                    <div class="h-5 bg-gray-200 dark:bg-gray-700 rounded-full skeleton w-20"></div>
                    <div class="h-5 bg-gray-200 dark:bg-gray-700 rounded-full skeleton w-16"></div>
                </div>
                <div class="space-y-1">
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded skeleton w-full"></div>
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded skeleton w-3/4"></div>
                </div>
                <div class="flex gap-1.5 mt-auto">
                    <div class="w-7 h-7 bg-gray-200 dark:bg-gray-700 rounded-md skeleton"></div>
                    <div class="w-7 h-7 bg-gray-200 dark:bg-gray-700 rounded-md skeleton"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="lg:hidden bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="flex gap-3 p-3">
            <div class="flex-shrink-0 w-24 h-24 bg-gray-200 dark:bg-gray-700 rounded-lg skeleton"></div>
            <div class="flex-1 min-w-0 flex flex-col space-y-2">
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded skeleton w-4/5"></div>
                <div class="flex items-center gap-2">
                    <div class="h-5 bg-gray-200 dark:bg-gray-700 rounded-full skeleton w-20"></div>
                    <div class="h-5 bg-gray-200 dark:bg-gray-700 rounded-full skeleton w-16"></div>
                </div>
                <div class="space-y-1">
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded skeleton w-full"></div>
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded skeleton w-5/6"></div>
                </div>
                <div class="flex gap-1.5 mt-auto">
                    <div class="w-7 h-7 bg-gray-200 dark:bg-gray-700 rounded-md skeleton"></div>
                    <div class="w-7 h-7 bg-gray-200 dark:bg-gray-700 rounded-md skeleton"></div>
                    <div class="w-7 h-7 bg-gray-200 dark:bg-gray-700 rounded-md skeleton"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Desktop Skeleton Cards -->
    <div class="hidden lg:block bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 overflow-hidden p-4">
        <div class="w-full h-48 bg-gray-200 dark:bg-gray-700 rounded-lg skeleton mb-4"></div>
        <div class="space-y-3">
            <div class="h-5 bg-gray-200 dark:bg-gray-700 rounded skeleton w-3/4"></div>
            <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded skeleton w-1/2"></div>
            <div class="space-y-2">
                <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded skeleton w-full"></div>
                <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded skeleton w-5/6"></div>
            </div>
            <div class="flex gap-2 mt-4">
                <div class="h-6 bg-gray-200 dark:bg-gray-700 rounded skeleton w-24"></div>
                <div class="h-6 bg-gray-200 dark:bg-gray-700 rounded skeleton w-24"></div>
            </div>
        </div>
    </div>
</div>
