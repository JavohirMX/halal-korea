<script>
(function() {
    function showBusinessHoursEditor() {
        const container = document.getElementById('business-hours-editor-container');
        const cta = document.getElementById('add-hours-cta');
        if (container) {
            container.classList.remove('hidden');
        }
        if (cta) {
            cta.classList.add('hidden');
        }
        if (container) {
            container.dataset.hoursEnabled = 'true';
            const section = document.getElementById('hours-section');
            if (section && section.classList.contains('hidden')) {
                window.toggleSection('hours-section');
            }
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (window.setBusinessHoursEnabled) {
            window.setBusinessHoursEnabled();
        }
        if (window.markHoursModified) {
            window.markHoursModified();
        }
        if (window.setBusinessHoursTouched) {
            window.setBusinessHoursTouched();
        } else {
            window._hoursEditorTouched = true;
        }
    }

    window.showBusinessHoursEditor = showBusinessHoursEditor;

    document.addEventListener('DOMContentLoaded', function() {
        const addButton = document.getElementById('add-hours-button');
        if (addButton) {
            addButton.addEventListener('click', showBusinessHoursEditor);
        }
    });

    if (!window.toggleSection) {
        window.toggleSection = function(sectionId) {
            const section = document.getElementById(sectionId);
            if (!section) return;
            const chevron = document.getElementById('hours-chevron');
            if (section.classList.contains('hidden')) {
                section.classList.remove('hidden');
                if (chevron) {
                    chevron.classList.add('rotate-180');
                }
            } else {
                section.classList.add('hidden');
                if (chevron) {
                    chevron.classList.remove('rotate-180');
                }
            }
        };
    }

    window.initBusinessHoursEditor = function(options) {
        const existingHoursData = options && options.existingHoursData ? options.existingHoursData : null;
        const onChange = options && options.onChange ? options.onChange : null;
        let hoursModified = false;
        let hoursTouched = false;
        let hoursEnabled = false;

        function markHoursModified() {
            hoursTouched = true;
            hoursModified = true;
            const suggestInput = document.getElementById('suggest_business_hours');
            if (suggestInput) {
                suggestInput.value = 'true';
            }
            const summary = document.getElementById('hours-change-summary');
            if (summary) {
                summary.classList.remove('hidden');
            }
            syncBusinessHoursJson();
            if (onChange) {
                onChange();
            }
        }

        window.markHoursModified = markHoursModified;
        window.setBusinessHoursEnabled = function() {
            hoursEnabled = true;
        };
        window.setBusinessHoursTouched = function() {
            hoursTouched = true;
        };
        window.isBusinessHoursTouched = function() {
            return hoursTouched;
        };
        window.isBusinessHoursEnabled = function() {
            return hoursEnabled;
        };

        window.toggleDayClosed = function(dayIndex, isClosed) {
            const dayRow = document.querySelector(`.day-row[data-day="${dayIndex}"]`);
            if (!dayRow) return;
            const slotsContainer = dayRow.querySelector('.time-slots-container');
            const addBreakBtn = dayRow.querySelector('.add-break-btn');
            if (isClosed) {
                slotsContainer.style.opacity = '0.3';
                slotsContainer.style.pointerEvents = 'none';
                if (addBreakBtn) {
                    addBreakBtn.classList.add('hidden');
                }
            } else {
                slotsContainer.style.opacity = '1';
                slotsContainer.style.pointerEvents = 'auto';
                if (addBreakBtn) {
                    addBreakBtn.classList.remove('hidden');
                }
            }
            markHoursModified();
        };

        window.addTimeSlot = function(dayIndex) {
            const dayRow = document.querySelector(`.day-row[data-day="${dayIndex}"]`);
            if (!dayRow) return;
            const slotsContainer = dayRow.querySelector('.time-slots-container');
            slotsContainer.querySelectorAll('.remove-slot').forEach(btn => {
                btn.classList.remove('hidden');
            });
            const newSlot = document.createElement('div');
            newSlot.className = 'time-slot flex items-center gap-2 mb-2';
            newSlot.innerHTML = `
                <input type="text" class="open-time time-input flex-1 px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:ring-primary-500 focus:border-primary-500 text-center font-mono"
                       placeholder="14:00" value="14:00" maxlength="5" pattern="[0-2][0-9]:[0-5][0-9]"
                       oninput="formatTimeInput(this)" onblur="validateTimeInput(this)">
                <span class="text-gray-500">—</span>
                <input type="text" class="close-time time-input flex-1 px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:ring-primary-500 focus:border-primary-500 text-center font-mono"
                       placeholder="22:00" value="22:00" maxlength="5" pattern="[0-2][0-9]:[0-5][0-9]"
                       oninput="formatTimeInput(this)" onblur="validateTimeInput(this)">
                <button type="button" class="remove-slot p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors"
                        onclick="removeTimeSlot(this)">
                    <i class="fas fa-times"></i>
                </button>
            `;
            slotsContainer.appendChild(newSlot);
            newSlot.querySelectorAll('input').forEach(input => {
                input.addEventListener('change', markHoursModified);
                input.addEventListener('input', markHoursModified);
            });
            markHoursModified();
        };

        window.removeTimeSlot = function(button) {
            const slot = button.closest('.time-slot');
            if (!slot) return;
            const container = slot.parentElement;
            slot.remove();
            const remainingSlots = container.querySelectorAll('.time-slot');
            if (remainingSlots.length === 1) {
                remainingSlots[0].querySelector('.remove-slot').classList.add('hidden');
            }
            markHoursModified();
        };

        window.toggle24Hours = function(isChecked) {
            const editor = document.getElementById('hours-editor');
            if (!editor) return;
            if (isChecked) {
                editor.style.opacity = '0.5';
                editor.style.pointerEvents = 'none';
            } else {
                editor.style.opacity = '1';
                editor.style.pointerEvents = 'auto';
            }
            markHoursModified();
        };

        window.formatTimeInput = function(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + ':' + value.substring(2, 4);
            }
            input.value = value;
            markHoursModified();
        };

        window.validateTimeInput = function(input) {
            const value = input.value;
            const timeRegex = /^([0-1][0-9]|2[0-3]):([0-5][0-9])$/;
            if (!value) {
                return;
            }
            if (!timeRegex.test(value)) {
                let fixed = value.replace(/[^0-9:]/g, '');
                if (/^\d{3,4}$/.test(fixed)) {
                    fixed = fixed.padStart(4, '0');
                    fixed = fixed.substring(0, 2) + ':' + fixed.substring(2, 4);
                }
                if (timeRegex.test(fixed)) {
                    input.value = fixed;
                } else {
                    input.value = input.placeholder || '09:00';
                }
            }
            const parts = input.value.split(':');
            if (parts.length === 2) {
                let hours = parseInt(parts[0], 10);
                let minutes = parseInt(parts[1], 10);
                if (hours > 23) hours = 23;
                if (minutes > 59) minutes = 59;
                input.value = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
            }
        };

        function serializeBusinessHours() {
            if (!hoursModified && !hoursTouched && !hoursEnabled) {
                return null;
            }
            const is24HoursInput = document.getElementById('is_24_hours');
            const is24Hours = is24HoursInput ? is24HoursInput.checked : false;
            const notesInput = document.getElementById('business_hours_notes');
            const notes = notesInput ? notesInput.value : '';
            const hours = {};
            if (!is24Hours) {
                document.querySelectorAll('.day-row').forEach(row => {
                    const dayIndex = row.dataset.day;
                    const isClosed = row.querySelector('.day-closed-toggle').checked;
                    if (isClosed) {
                        hours[dayIndex] = 'closed';
                    } else {
                        const slots = [];
                        row.querySelectorAll('.time-slot').forEach(slot => {
                            const openTime = slot.querySelector('.open-time').value;
                            const closeTime = slot.querySelector('.close-time').value;
                            if (openTime && closeTime) {
                                slots.push({ open: openTime, close: closeTime });
                            }
                        });
                        if (slots.length > 0) {
                            hours[dayIndex] = slots;
                        }
                    }
                });
            }

            const jsonData = JSON.stringify({
                is_24_hours: is24Hours,
                hours: hours,
                notes: notes
            });

            const jsonInput = document.getElementById('business_hours_json');
            if (jsonInput) {
                jsonInput.value = jsonData;
            }
            const suggestInput = document.getElementById('suggest_business_hours');
            if (suggestInput) {
                suggestInput.value = 'true';
            }
            return jsonData;
        }

        function syncBusinessHoursJson() {
            if (hoursEnabled || hoursTouched || hoursModified) {
                serializeBusinessHours();
            }
        }

        window.serializeBusinessHours = serializeBusinessHours;
        window.isBusinessHoursModified = function() {
            return hoursModified;
        };

        function initializeBusinessHours() {
            if (!existingHoursData) {
                if (window._hoursEditorTouched) {
                    hoursTouched = true;
                }
                return;
            }
            hoursEnabled = true;
            const container = document.getElementById('business-hours-editor-container');
            if (container) {
                container.dataset.hoursEnabled = 'true';
            }
            if (existingHoursData.is_24_hours) {
                const checkbox = document.getElementById('is_24_hours');
                if (checkbox) {
                    checkbox.checked = true;
                    toggle24Hours(true);
                }
            }
            if (existingHoursData.notes) {
                const notesInput = document.getElementById('business_hours_notes');
                if (notesInput) {
                    notesInput.value = existingHoursData.notes;
                }
            }
            if (existingHoursData.slots) {
                document.querySelectorAll('.day-row').forEach(row => {
                    const dayIndex = row.dataset.day;
                    const daySlots = existingHoursData.slots[dayIndex];
                    if (daySlots && daySlots.length > 0) {
                        const slotsContainer = row.querySelector('.time-slots-container');
                        const closedCheckbox = row.querySelector('.day-closed-toggle');
                        if (daySlots[0].is_closed) {
                            closedCheckbox.checked = true;
                            toggleDayClosed(parseInt(dayIndex, 10), true);
                        } else {
                            const firstSlot = slotsContainer.querySelector('.time-slot');
                            if (firstSlot && daySlots[0].open && daySlots[0].close) {
                                firstSlot.querySelector('.open-time').value = daySlots[0].open;
                                firstSlot.querySelector('.close-time').value = daySlots[0].close;
                            }
                            for (let i = 1; i < daySlots.length; i++) {
                                if (daySlots[i].open && daySlots[i].close) {
                                    addTimeSlot(parseInt(dayIndex, 10));
                                    const allSlots = slotsContainer.querySelectorAll('.time-slot');
                                    const newSlot = allSlots[allSlots.length - 1];
                                    newSlot.querySelector('.open-time').value = daySlots[i].open;
                                    newSlot.querySelector('.close-time').value = daySlots[i].close;
                                }
                            }
                        }
                    }
                });
            }
            hoursModified = false;
            const suggestInput = document.getElementById('suggest_business_hours');
            if (suggestInput) {
                suggestInput.value = 'false';
            }
            const summary = document.getElementById('hours-change-summary');
            if (summary) {
                summary.classList.add('hidden');
            }
            if (onChange) {
                onChange();
            }
        }

        document.querySelectorAll('.time-slot input').forEach(input => {
            input.addEventListener('change', markHoursModified);
            input.addEventListener('input', markHoursModified);
        });

        const hoursSection = document.getElementById('hours-section');
        if (hoursSection) {
            const markTouched = () => {
                hoursTouched = true;
            };
            hoursSection.addEventListener('input', markTouched);
            hoursSection.addEventListener('change', markTouched);
        }

        initializeBusinessHours();

        return {
            isModified: function() {
                return hoursModified;
            },
            serialize: serializeBusinessHours
        };
    };
})();
</script>
