{% extends 'places/base.html' %}

{% block extra_head %}
<script>
    // Define initMap globally
    async function initMap() {
        // Center on Seoul by default
        const seoul = { lat: 37.5665, lng: 126.9780 };
        const { Map } = await google.maps.importLibrary("maps")
        const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");


        map = new Map(document.getElementById("map"), {
            zoom: 12,
            center: seoul,
            mapId: 'DEMO_MAP_ID',
        });
        
        let marker = null;

        // Add click listener to map
        map.addListener('click', function(e) {
            const lat = e.latLng.lat();
            const lng = e.latLng.lng();
            
            // Update hidden inputs
            document.getElementById('id_latitude').value = lat;
            document.getElementById('id_longitude').value = lng;
            
            // Update or add marker
            if (marker) {
                marker.position = e.latLng;
            } else {
                marker = new AdvancedMarkerElement({
                    map,
                    position: e.latLng,
                    draggable: true
                });

                // Update coordinates when marker is dragged
                marker.addListener('dragend', function() {
                    const position = marker.getPosition();
                    document.getElementById('id_latitude').value = position.lat();
                    document.getElementById('id_longitude').value = position.lng();
                });
            }
        });
        
    }

    // Initialize map when the page loads
    document.addEventListener('DOMContentLoaded', function() {
        initMap();
    });
</script>

{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Submit a New Place</h1>
        <p class="mt-2 text-gray-600 dark:text-gray-400">Help others find halal places by submitting a new location</p>
    </div>

    <!-- Form Container -->
    <div class="glass-card rounded-lg p-6">
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <!-- Basic Information -->
            <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                <div>
                    <label for="place-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Place Name <span class="text-red-500">*</span>
                    </label>
                    <div class="relative mt-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-store text-gray-400"></i>
                        </div>
                        <input type="text" 
                               id="place-name"
                               name="name" 
                               required 
                               placeholder="Enter place name"
                               class="pl-10 block w-full h-11 rounded border-gray-300 bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 focus:border-primary-500 focus:ring-primary-500 transition duration-150 ease-in-out">
                    </div>
                </div>

                <div>
                    <label for="place-category" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Category <span class="text-red-500">*</span>
                    </label>
                    <div class="relative mt-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-tag text-gray-400"></i>
                        </div>
                        <select id="place-category"
                                name="category" 
                                required 
                                class="pl-10 block w-full h-11 rounded border-gray-300 bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 focus:border-primary-500 focus:ring-primary-500 transition duration-150 ease-in-out">
                            <option value="">Select a category</option>
                            <option value="restaurant">Restaurant</option>
                            <option value="market">Market</option>
                            <option value="mosque">Mosque</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div>
                <label for="place-description" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                    Description <span class="text-red-500">*</span>
                </label>
                <div class="relative mt-1">
                    <textarea id="place-description"
                              name="description" 
                              rows="4" 
                              required 
                              placeholder="Describe the place..."
                              class="block w-full p-3 rounded border-gray-300 bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 focus:border-primary-500 focus:ring-primary-500 transition duration-150 ease-in-out"></textarea>
                    <div class="absolute bottom-2 right-2 text-xs text-gray-400">
                        <span id="char-count">0</span>/500
                    </div>
                </div>
            </div>

            <!-- Location -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Location
                </label>
                <div class="h-64 rounded-lg overflow-hidden mb-2">
                    <div id="map" class="w-full h-full dark:brightness-90"></div>
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400">
                    Click on the map to set the location
                </p>
                <input type="hidden" name="latitude" id="id_latitude" required>
                <input type="hidden" name="longitude" id="id_longitude" required>
            </div>

            <!-- Address and Contact -->
            <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                <div>
                    <label for="place-address" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Address
                    </label>
                    <div class="relative mt-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-location-dot text-gray-400"></i>
                        </div>
                        <input type="text" 
                           id="place-address"
                           name="address" 
                           required 
                           placeholder="Enter address"
                           class="pl-10 block w-full h-11 rounded border-gray-300 bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 focus:border-primary-500 focus:ring-primary-500">
                           
                    </div>
                    
                </div>

                <div>
                    <label for="place-phone" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Phone Number
                    </label>
                    <div class="relative mt-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-phone text-gray-400"></i>
                        </div>
                        <input type="tel" 
                            id="place-phone"
                            name="phone_number" 
                            placeholder="Enter phone number"
                            class="pl-10 block w-full h-11 rounded border-gray-300 bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 focus:border-primary-500 focus:ring-primary-500">
                    </div>
                    
                </div>
            </div>

            <!-- Website and Map Links -->
            <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                <div>
                    <label for="place-website" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Website
                    </label>
                    <div class="relative mt-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-globe text-gray-400"></i>
                        </div>
                        <input type="url" 
                            id="place-website"
                            name="website"
                            placeholder="Enter website URL" 
                            class="pl-10 block w-full h-11 rounded border-gray-300 bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 focus:border-primary-500 focus:ring-primary-500">
                    </div>
                    
                </div>

                <div>
                    <label for="place-google-map" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Google Maps Link
                    </label>
                    <div class="relative mt-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-map-location-dot text-gray-400"></i>
                        </div>
                        <input type="url" 
                           id="place-google-map"
                           name="google_map_link"
                            placeholder="Enter Google Maps link" 
                           class="pl-10 block w-full h-11 rounded border-gray-300 bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 focus:border-primary-500 focus:ring-primary-500">
                    </div>
                    
                </div>
            </div>

            <!-- Photos -->
            <div>
                <label for="photo-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Photos
                </label>
                <div id="drop-zone" class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 dark:border-gray-600 border-dashed rounded-md hover:border-primary-500 dark:hover:border-primary-400 transition-colors duration-200">
                    <div class="space-y-1 text-center">
                        <i class="fas fa-image text-gray-400 dark:text-gray-600 text-3xl mb-3"></i>
                        <div class="flex text-sm text-gray-600 dark:text-gray-400">
                            <label for="photo-input" class="relative cursor-pointer rounded-md font-medium text-primary-600 dark:text-primary-400 hover:text-primary-500 focus-within:outline-none">
                                <span>Upload photos</span>
                                <input id="photo-input" 
                                       name="photos" 
                                       type="file" 
                                       multiple 
                                       accept="image/*" 
                                       class="sr-only">
                            </label>
                            <p class="pl-1">or drag and drop</p>
                        </div>
                        <p class="text-xs text-gray-500 dark:text-gray-400">
                            PNG, JPG, GIF up to 10MB each
                        </p>
                    </div>
                </div>
                <div id="photo-preview" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end">
                <button type="submit" 
                        class="gradient-bg-hover text-white font-medium py-2 px-4 rounded-md transition-all duration-200">
                    Submit Place
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Photo preview and drag & drop handling
    const photoInput = document.getElementById('photo-input');
    const dropZone = document.getElementById('drop-zone');
    const preview = document.getElementById('photo-preview');
    let currentFiles = []; // Keep track of current files

    // Handle file selection through input
    photoInput.addEventListener('change', function(e) {
        const newFiles = Array.from(e.target.files);
        handleFiles(newFiles, true);
    });

    // Prevent default drag behaviors
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
    });

    // Highlight drop zone when dragging over it
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, unhighlight, false);
    });

    // Handle dropped files
    dropZone.addEventListener('drop', handleDrop, false);

    function preventDefaults (e) {
        e.preventDefault();
        e.stopPropagation();
    }

    function highlight(e) {
        dropZone.classList.add('border-primary-500', 'bg-primary-50', 'dark:border-primary-400', 'dark:bg-primary-900');
    }

    function unhighlight(e) {
        dropZone.classList.remove('border-primary-500', 'bg-primary-50', 'dark:border-primary-400', 'dark:bg-primary-900');
    }

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(Array.from(files), true);
    }

    function handleFiles(newFiles, append = false) {
        // If not appending, clear everything
        if (!append) {
            preview.innerHTML = '';
            currentFiles = [];
        }

        // Add new files to current files
        newFiles.forEach(file => {
            if (!file.type.startsWith('image/')) return;
            
            // Check if file already exists
            const isDuplicate = currentFiles.some(existingFile => 
                existingFile.name === file.name && 
                existingFile.size === file.size
            );

            if (!isDuplicate) {
                currentFiles.push(file);
                createPreview(file);
            }
        });

        // Update the file input
        const dataTransfer = new DataTransfer();
        currentFiles.forEach(file => dataTransfer.items.add(file));
        photoInput.files = dataTransfer.files;
    }

    function createPreview(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const div = document.createElement('div');
            div.className = 'relative aspect-square';
            div.innerHTML = `
                <div class="h-full">
                    <img src="${e.target.result}" 
                         alt="Preview" 
                         class="w-full h-full object-cover rounded-lg">
                    <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 hover:opacity-100 transition-opacity flex items-center justify-center rounded-lg">
                        <button type="button" 
                                class="text-white hover:text-red-500 p-2"
                                onclick="removePhoto(this)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            preview.appendChild(div);
        };
        reader.readAsDataURL(file);
    }

    function removePhoto(button) {
        const photoDiv = button.closest('.relative');
        const index = Array.from(preview.children).indexOf(photoDiv);
        
        // Remove from preview with animation
        photoDiv.style.transition = 'all 0.3s ease';
        photoDiv.style.opacity = '0';
        photoDiv.style.transform = 'scale(0.8)';
        
        setTimeout(() => {
            // Remove from currentFiles array
            currentFiles.splice(index, 1);
            
            // Clear and rebuild preview
            preview.innerHTML = '';
            
            // Recreate all previews
            currentFiles.forEach(file => {
                createPreview(file);
            });
            
            // Update the file input
            const dt = new DataTransfer();
            currentFiles.forEach(file => dt.items.add(file));
            photoInput.files = dt.files;
        }, 300);
    }

    // Form validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const lat = document.getElementById('id_latitude').value;
        const lng = document.getElementById('id_longitude').value;
        
        if (!lat || !lng) {
            e.preventDefault();
            alert('Please select a location on the map');
        }
    });

    const textarea = document.querySelector('textarea[name="description"]');
    const charCount = document.getElementById('char-count');

    textarea.addEventListener('input', function() {
        const count = this.value.length;
        charCount.textContent = count;
        
        if (count > 450) {
            charCount.classList.add('text-yellow-500');
        } else {
            charCount.classList.remove('text-yellow-500');
        }
        
        if (count > 500) {
            charCount.classList.add('text-red-500');
        } else {
            charCount.classList.remove('text-red-500');
        }
    });
</script>
{% endblock %}
